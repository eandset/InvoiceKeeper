version: '3.8'

services:
  # 1. База данных
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_keeper}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, see .env.example}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoice_keeper}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Бэкенд (.NET 10)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: "true"
      Database__Host: db
      Database__Port: 5432
      Database__Name: ${POSTGRES_DB:-invoice_keeper}
      Database__Username: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env, see .env.example}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env, see .env.example}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN in .env, see .env.example}
      HttpsRedirection__Enabled: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # 3. Фронтенд (React + Vite / Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8080}
    ports:
      - "80:80"
    depends_on:
      - backend

  # 4. Telegram Бот (Python)
  tgbot:
    build:
      context: ./tgbot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_URL=http://backend:${BACKEND_PORT:-8080}/api/v1
      - BOT_SERVICE_TOKEN=${BOT_SERVICE_TOKEN}
      - TARGET_CHAT_ID=${TARGET_CHAT_ID}
    depends_on:
      - backend

volumes:
  pgdata: